services:
  rclone-bot:
    build:
      context: .
    container_name: rclone-telegram-bot
    restart: unless-stopped
    env_file:
      - config.env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - rclone_config:/root/.config/rclone
      - bot_session:/app
    tmpfs:
      - /tmp/rclone_dl:rw,noexec,nosuid,size=6g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rclone_config:
  bot_session:
